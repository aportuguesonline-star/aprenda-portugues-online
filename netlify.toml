# Site estático: publica a própria pasta, sem build.
[build]
  publish = "."

# Imagens e ícones mudam pouco: cache longo no navegador.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.(svg|png|jpg)"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# A página em si: sempre revalida, para mudanças de preço/oferta aparecerem na hora.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Atalho curto para a bio do Instagram: leva à página de links já marcando a origem.
[[redirects]]
  from = "/bio"
  to = "/links/?utm_source=instagram&utm_medium=bio"
  status = 302

# Páginas internas (calendários de conteúdo): fora do Google e sem cache longo.
[[headers]]
  for = "/plano-*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "public, max-age=0, must-revalidate"
